name: Tests & Coverage

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        # Exit on error
        flake8 sdd/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warn but don't fail
        flake8 sdd/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Security check with bandit
      run: |
        bandit -r sdd/ -ll --exit-zero || true
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        pytest --tb=short

    - name: Generate coverage report
      run: |
        pytest --cov=sdd --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=85
