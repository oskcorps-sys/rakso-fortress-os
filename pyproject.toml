[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdd-plus"
version = "0.1.0"
description = "Specification-Driven Development Extended - multi-agent AI orchestration framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Oscar", email = "oscar@regusense.com"},
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-yaml>=0.11.0",
    "typer[all]>=0.9.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-watch>=4.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
sdd = "sdd.cli.main:app"

[tool.uv]
python = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "sdd"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=sdd --cov-report=html --cov-report=term-missing"
minversion = "7.0"

[tool.coverage.run]
source = ["sdd"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-length handled by black

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
