phase: 4
created_at: "2026-05-20T00:30:00Z"
author: "Claude (Auditor)"
title: "Phase 4 — Harness Closure (File-Pattern Enforcement + Git Integration)"

sprint_mapping: |
  PHASE_4_ROADMAP.md groups Phase 4 work into 4 sprints. The SDD+ state machine
  has one DRAFT->COMPLETED cycle per phase, so each roadmap sprint maps to one
  state-machine phase:
    - Phase 4  = Roadmap Sprint 1 — Harness Closure        (THIS SPEC)
    - Phase 5  = Roadmap Sprint 2 — Telemetry & Metrics
    - Phase 6  = Roadmap Sprint 3 — Web Dashboard
    - Phase 7  = Roadmap Sprint 4 — PyPI Packaging
  This SPEC is scope-locked to Phase 4 (Sprint 1) only.

description: |
  Phases 1-3 built the harness frame: schemas, validators, a state machine, an
  audit loop, and a machine-readable authority matrix (AGENTS.yaml). But the
  authority matrix is still only *declarative* — AGENTS.yaml says which files
  each role may touch, and nothing enforces it at commit time.

  Phase 4 closes that gap. It makes the harness *bite*:

  1. File-pattern enforcement — a git pre-commit hook reads AGENTS.yaml and
     rejects any staged file that matches the active role's forbidden patterns.
     An implementer physically cannot commit a SPEC; an auditor physically
     cannot commit source code.
  2. Git integration — SDD lifecycle events optionally drive git: `sdd new-phase
     --git` creates the feature branch, `sdd audit --git` commits the audit
     artifact. Flag-gated so CI and scripted use stay deterministic.

user_story: |
  As Oscar (operator/architect), I need the authority matrix to be enforced,
  not merely documented. When an AI agent works in a role:
  - It cannot commit files outside its role — the pre-commit hook blocks it
  - The block is loud and explains exactly which file and which rule failed
  - If no role is declared, enforcement is a silent no-op (advisory mode) so
    existing repos and non-SDD contributors are never disrupted
  - Installing the hook never destroys a pre-existing pre-commit hook
  - Phase/audit git steps are automated but opt-in, never surprising

success_criteria:
  - "sdd/enforcement.py matches file paths against AGENTS.yaml glob patterns (** and * supported)"
  - "A git pre-commit hook rejects staged files matching the active role's forbidden_file_patterns"
  - "`sdd install-hooks --role R` installs the hook and records the role; never clobbers an existing hook"
  - "`sdd check-patterns` reports violations for a given role + fileset (dry-run, also used by the hook)"
  - "No role declared => enforcement is a no-op (advisory), exit 0"
  - "`sdd new-phase --git` creates branch feature/phase-N; `sdd audit --git` commits the AUDIT artifact"
  - "Backwards compatible: no AGENTS.yaml => no enforcement, no error"
  - "No new top-level dependencies (stdlib pathlib + subprocess only)"
  - "≥85% coverage on every new module; all 118 existing tests still pass"

scope:
  included:
    - "sdd/enforcement.py — pattern matcher + pre-commit hook generator/installer"
    - "sdd/git_integration.py — git helpers (repo detection, branch, commit, clean-tree check)"
    - "sdd/cli/commands/install_hooks.py — `sdd install-hooks` command"
    - "sdd/cli/commands/check_patterns.py — `sdd check-patterns` command"
    - "tests/test_enforcement.py — pattern matching + hook generation tests"
    - "tests/test_git_integration.py — git helper tests"
    - "tests/test_hooks_cli.py — install-hooks + check-patterns CLI tests"

  modified:
    - "sdd/cli/main.py — register install-hooks and check-patterns commands"
    - "sdd/cli/commands/new_phase.py — add opt-in --git flag (auto-branch)"
    - "sdd/cli/commands/audit.py — add opt-in --git flag (auto-commit AUDIT.yaml)"

  deferred_to_later_phases:
    - "Telemetry & metrics emission (Phase 5)"
    - "Web dashboard (Phase 6)"
    - "PyPI packaging (Phase 7)"
    - "Advanced conflict resolution (post-Phase-4, see roadmap)"
    - "Strict allowlist enforcement — Phase 4 enforces the denylist (forbidden_file_patterns) only"

enforcement_spec:
  semantics: |
    Enforcement is a DENYLIST. A staged file is a violation if it matches any
    glob in the active role's `forbidden_file_patterns`. Files that match only
    `allowed_file_patterns`, or match neither list (README.md, pyproject.toml,
    .gitignore, etc.), are permitted. This satisfies the harness requirement
    ("implementer cannot commit SPEC, auditor cannot commit src") without
    blocking neutral files. Strict allowlist mode is explicitly deferred.
  pattern_matching: |
    Glob patterns use pathlib.PurePosixPath.full_match (Python 3.13+; runtime
    is 3.14). Supports ** (recursive) and * (single segment). File paths are
    normalized to forward slashes before matching.
  role_resolution: |
    Active role is resolved in order: (1) env var SDD_ROLE, (2) .sdd-role file
    at repo root, (3) none. If none, enforcement is a no-op and exits 0.
  hook_design: |
    install-hooks writes .git/hooks/pre-commit, a /bin/sh script carrying the
    marker line "# SDD+ pre-commit hook" and running:
        python -m sdd.cli.main check-patterns --staged
    If a pre-commit hook already exists and lacks the SDD marker, it is backed
    up to .git/hooks/pre-commit.pre-sdd before the SDD hook is written. If it
    already carries the marker, it is overwritten in place (an update).

git_integration_spec:
  helpers: |
    sdd/git_integration.py wraps `git` via subprocess.run:
      - is_git_repo(path) -> bool
      - get_current_branch(path) -> str
      - is_tree_clean(path) -> bool
      - create_branch(name, path) -> dict
      - stage_and_commit(message, files, path) -> dict
    Every helper degrades gracefully (returns False / raises a typed error)
    when git is absent or the path is not a repository.
  new_phase_git: |
    `sdd new-phase --role auditor --git` — after the phase advances, create
    branch feature/phase-{N}. Without --git, behaviour is unchanged.
  audit_git: |
    `sdd audit --role auditor --git` — after writing PHASE_N_AUDIT.yaml, if the
    verdict is APPROVED, stage and commit the artifact with a conventional
    message. Without --git, behaviour is unchanged.

constraints:
  - "No new top-level dependencies — stdlib pathlib + subprocess only"
  - "Backwards compatible: absent AGENTS.yaml or absent role => no enforcement, no error"
  - "install-hooks must never destroy a pre-existing pre-commit hook (back it up)"
  - "Hook installation is opt-in — nothing is installed without an explicit `sdd install-hooks`"
  - "Git --git flags are opt-in and default off"
  - "Coverage ≥85% on every new module"
  - "All 118 existing tests must continue passing"
  - "CLI output stays ASCII-only (no glyphs) — Windows console safe"

acceptance_tests:
  - name: "test_pattern_matches_glob"
    given: "Glob patterns src/**/*, sdd/artifacts/SPEC*.yaml, AGENTS.yaml"
    when: "match_pattern is called with matching and non-matching paths"
    then: "Returns True for matches (incl. nested **), False otherwise"

  - name: "test_implementer_cannot_stage_spec"
    given: "AGENTS.yaml loaded, role=implementer"
    when: "check_files(['sdd/artifacts/PHASE_4_SPEC.yaml'])"
    then: "One violation reported — SPEC is in implementer forbidden patterns"

  - name: "test_auditor_cannot_stage_src"
    given: "AGENTS.yaml loaded, role=auditor"
    when: "check_files(['src/foo.py'])"
    then: "One violation reported — src/** is in auditor forbidden patterns"

  - name: "test_neutral_file_allowed"
    given: "AGENTS.yaml loaded, either role"
    when: "check_files(['README.md', 'pyproject.toml'])"
    then: "No violations — neutral files match no forbidden pattern"

  - name: "test_no_role_is_noop"
    given: "No SDD_ROLE env var and no .sdd-role file"
    when: "check_files runs"
    then: "No violations, advisory no-op, exit 0"

  - name: "test_install_hooks_writes_precommit"
    given: "A git repo with no pre-commit hook"
    when: "sdd install-hooks --role implementer"
    then: ".git/hooks/pre-commit exists, carries the SDD marker, .sdd-role written"

  - name: "test_install_hooks_preserves_existing"
    given: "A git repo with an existing non-SDD pre-commit hook"
    when: "sdd install-hooks --role implementer"
    then: "Original hook backed up to pre-commit.pre-sdd with content intact"

  - name: "test_check_patterns_cli_clean"
    given: "role=implementer, fileset = tests/test_x.py"
    when: "sdd check-patterns --role implementer --files tests/test_x.py"
    then: "Exit 0, reports no violations"

  - name: "test_check_patterns_cli_violation"
    given: "role=implementer, fileset = sdd/artifacts/PHASE_4_SPEC.yaml"
    when: "sdd check-patterns --role implementer --files <that>"
    then: "Exit 1, names the offending file and the rule"

  - name: "test_git_is_repo_detection"
    given: "A directory that is / is not a git repo"
    when: "is_git_repo(path)"
    then: "True for a repo, False otherwise"

  - name: "test_git_current_branch"
    given: "A git repo on a known branch"
    when: "get_current_branch(path)"
    then: "Returns the branch name"

  - name: "test_git_tree_clean_detection"
    given: "A git repo with and without uncommitted changes"
    when: "is_tree_clean(path)"
    then: "True when clean, False when dirty"

  - name: "test_new_phase_git_flag_creates_branch"
    given: "current_state=COMPLETED in a git repo"
    when: "sdd new-phase --role auditor --git"
    then: "Branch feature/phase-N created, phase advanced"

  - name: "test_audit_git_flag_commits"
    given: "An APPROVED audit run in a git repo"
    when: "sdd audit --role auditor --git"
    then: "PHASE_N_AUDIT.yaml is committed with a conventional message"

  - name: "test_coverage_threshold"
    kind: "criterion"
    given: "All Phase 4 code"
    when: "pytest --cov on new modules"
    then: "Coverage ≥85% on each new module"

git_workflow:
  branch: "feature/phase-4"
  commit_sequence:
    - "PHASE 4: Spec + Contract"
    - "PHASE 4: File-pattern enforcement module"
    - "PHASE 4: install-hooks + check-patterns commands"
    - "PHASE 4: Git integration module + --git flags"
    - "PHASE 4: Tests + coverage ≥85%"
  pr_target: "master"

dependencies:
  - "Phase 3 complete and merged (AGENTS.yaml, agent schema, audit, new-phase)"
  - "118 tests passing on master"
  - "Python 3.13+ runtime (pathlib.PurePath.full_match) — confirmed 3.14.5"

status: READY_FOR_CONTRACT
